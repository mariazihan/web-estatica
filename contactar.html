<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/contactar.css">
    <link rel="stylesheet" href="./assets/css/nav_footer.css">
    <link rel="icon" href="./assets/img/favicon.jpg">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <nav class="navbar p-3 ">
                    <div class="d-flex w-100 align-items-center justify-content-between">
                        <img src="./assets/img/small-logo.PNG" alt="Logo Cuatrovientos" class="img-fluid logo">
                        <ul class="ul-menu d-flex list-unstyled mb-0">
                            <li class="nav-li"><a class="nav-link " href="./index.html">Index</a></li>
                            <li class="nav-li"> <a class="nav-link " href="./events.html">Events</a></li>
                            <li class="nav-li"> <a class="nav-link " href="./contactar.html">Contactar</a></li>
                            <li class="nav-li"><a class="nav-link " href="./login.html">Iniciar sesión</a></li>

                        </ul>
                    </div>
                </nav>

            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h2>Contáctanos</h2>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="subname" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="subname" placeholder="Tus Apellidos">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="Tu correo">
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Asunto</label>
                        <input type="text" class="form-control" id="subject" placeholder="Asunto del mensaje">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="message" rows="3"
                            placeholder="Escribe tu mensaje aquí"></textarea>
                    </div>
                    <button type="submit" class="btn w-100">Enviar</button>
                </form>
            </div>

        </div>
    </div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <footer class="footer">
                    <div class="footer-container">
                        <p>&copy; 2025 MiSitioWeb. Todos los derechos reservados.</p>

                    </div>
                    <p>Contacto: secretaria@cuatrovientos.org | Teléfono: 948 12 41 29</p>
                    <div class="footer-redes">
                        <a href="https://www.facebook.com/cipcuatrovientos/"><img src="./assets/img/facebook.png"
                                alt="Facebook"></a>
                        <a href="https://www.instagram.com/cipcuatrovientos/?hl=es"><img
                                src="./assets/img/instagram.png" alt="Instagram"></a>
                        <a
                            href="https://www.linkedin.com/uas/login?session_redirect=https%3A%2F%2Fwww.linkedin.com%2Fcompany%2F4994017%2Fadmin%2Ffeed%2Fposts%2F"><img
                                src="./assets/img/linkedin.png" alt="Linkedin"></a>
                        <a href="https://www.cuatrovientos.org/"><img src="./assets/img/internet.png"
                                alt="Internet"></a>
                    </div>
                </footer>
            </div>
        </div>
    </div>

</body>

</html>
